# Garton user deployment stack
# Run from deploy/: docker compose -f docker-compose.garton.yml up -d
# Or from repo root: docker compose -f deploy/docker-compose.garton.yml up -d
# Env file: /opt/garton/.env  (see .env.example)
# NOTE: requires its own repo clone so ./grafana and ../Grafana_Dashboard
#       resolve to garton-specific paths (see README for setup steps)

networks:
  garton-network:
    driver: bridge

services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true

  influxdb:
    image: influxdb:1.11
    hostname: influxdb
    volumes:
      - /opt/garton/data/influxdb:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=${INFLUX_DATABASE}
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUX_PASSWORD}
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "influx", "-username", "admin", "-password", "${INFLUX_PASSWORD}", "-execute", "SHOW DATABASES"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: garton-grafana
    hostname: grafana
    volumes:
      - /opt/garton/data/grafana:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning/datasources:ro
      - ../Grafana_Dashboard:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SERVER_ROOT_URL=https://garton-grafana.big-gunter.com
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL=marcusolsson-hourly-heatmap-panel
      - GF_DATE_FORMATS_FULL_DATE=MMM Do, YYYY - hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_SECOND=hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=hh:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MMM DD hh:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MMM DD
      - GF_DATE_FORMATS_INTERVAL_MONTH=YYYY-MM
      - GF_DATE_FORMATS_INTERVAL_YEAR=YYYY
      # Forwarded into grafana/datasource.yaml via Grafana env-var substitution
      - INFLUX_DATABASE=${INFLUX_DATABASE}
      - INFLUX_MCP_PASSWORD=${INFLUX_MCP_PASSWORD}
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  garmin-fetch-data:
    build:
      context: ..
      dockerfile: Dockerfile
    image: garmin-fetch-data:physiology
    container_name: garton-garmin-fetch-data
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - /opt/garton/garminconnect-tokens:/home/appuser/.garminconnect
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_VERSION=1
      - INFLUXDB_ENDPOINT_IS_HTTP=true
      - INFLUXDB_USERNAME=garmin_writer
      - INFLUXDB_PASSWORD=${INFLUX_WRITER_PASSWORD}
      - INFLUXDB_DATABASE=${INFLUX_DATABASE}
      - GARMINCONNECT_IS_CN=False
      - TAG_MEASUREMENTS_WITH_USER_EMAIL=True
      # - LOG_LEVEL=INFO
      # - UPDATE_INTERVAL_SECONDS=300
      # - GARMINCONNECT_EMAIL=
      # - GARMINCONNECT_BASE64_PASSWORD=

  mcp-server:
    build:
      context: ./mcp_server
    environment:
      - INFLUX_HOST=influxdb
      - INFLUX_PORT=8086
      - INFLUX_USER=mcp_reader
      - INFLUX_PASSWORD=${INFLUX_MCP_PASSWORD}
      - INFLUX_DATABASE=${INFLUX_DATABASE}
      - INFLUX_WRITER_USER=garmin_writer
      - INFLUX_WRITER_PASSWORD=${INFLUX_WRITER_PASSWORD}
      - GARMIN_DEVICENAME=${GARMIN_DEVICENAME}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ALLOWED_USER=${GITHUB_ALLOWED_USER}
      - MCP_BASE_URL=https://garton-mcp.big-gunter.com
      - TOKEN_SECRET=${TOKEN_SECRET}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server-gpt:
    build:
      context: ./mcp_server_gpt
    environment:
      - INFLUX_HOST=influxdb
      - INFLUX_PORT=8086
      - INFLUX_USER=mcp_reader
      - INFLUX_PASSWORD=${INFLUX_MCP_PASSWORD}
      - INFLUX_DATABASE=${INFLUX_DATABASE}
      - INFLUX_WRITER_USER=garmin_writer
      - INFLUX_WRITER_PASSWORD=${INFLUX_WRITER_PASSWORD}
      - GARMIN_DEVICENAME=${GARMIN_DEVICENAME}
      - GITHUB_CLIENT_ID=${GITHUB_GPT_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_GPT_CLIENT_SECRET}
      - GITHUB_ALLOWED_USER=${GITHUB_ALLOWED_USER}
      - MCP_BASE_URL=https://garton-mcp-gpt.big-gunter.com
      - TOKEN_SECRET=${TOKEN_SECRET_GPT}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- WHOOP integration (opt-in) ---
  # Start with: docker compose -f docker-compose.garton.yml --profile whoop up -d
  # Initial auth: docker compose -f docker-compose.garton.yml --profile whoop run --rm -p 8080:8080 whoop-fetch-data python -m whoop.whoop_auth
  whoop-fetch-data:
    profiles:
      - whoop
    build:
      context: ../
      dockerfile: deploy/Dockerfile.whoop
    container_name: garton-whoop-fetch-data
    restart: unless-stopped
    networks:
      - garton-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      - influxdb
    volumes:
      - /opt/garton/whoop-tokens:/home/appuser/.whoop
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USERNAME=garmin_writer
      - INFLUXDB_PASSWORD=${INFLUX_WRITER_PASSWORD}
      - INFLUXDB_DATABASE=${INFLUX_DATABASE}
      - WHOOP_CLIENT_ID=${WHOOP_CLIENT_ID}
      - WHOOP_CLIENT_SECRET=${WHOOP_CLIENT_SECRET}
      - WHOOP_TOKEN_DIR=/home/appuser/.whoop
      - UPDATE_INTERVAL_SECONDS=${UPDATE_INTERVAL_SECONDS:-300}
      # - LOG_LEVEL=INFO
      # - SKIP_EXISTING_DAILY=True
      # - TAG_MEASUREMENTS_WITH_USER_EMAIL=False
